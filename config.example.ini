; Sound Empire Monitor Configuration
; Публичный шаблон без секретов и реальных адресов

[Settings]
; Интервал проверки в секундах
check_interval_seconds = 60

; Время в минутах без изменений для отправки ошибки
timeout_minutes = 1

; Webhook URL для отправки сообщений
webhook_url = https://example.com/hooks/replace-me

; Список мониторинга (формат: Путь|Город)
; Можно добавлять сколько угодно строк в любом порядке
[Folders]
folder1 = \\server\share\logs|Москва
folder2 = \\server\share\logs|Санкт-Петербург